name: Maʼlumotni tuzatiş
description: Nomi, manzili, telefoni yoki iş vaqti notöğri
title: "Tuzatiş: "
labels: ["tuzatiş"]
body:
  - type: input
    id: page
    attributes:
      label: Qaysi joy
      description: Saytdagi havola yoki joy nomi
      placeholder: https://yalp.uz/b/chorsu-restorani
    validations: { required: true }

  - type: textarea
    id: problem
    attributes:
      label: Nimasi notöğri
      placeholder: Telefon raqami özgargan, yangisi +998 …
    validations: { required: true }
