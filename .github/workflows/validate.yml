name: Validate

# Runs on every pull request. This is what makes "anyone can send a PR"
# safe: malformed data cannot reach the site.
on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    # The rules that keep reviews honest — one per person per place, one
    # vote per person per review, a login link that works once — are
    # database constraints, not JavaScript. Testing them needs a real
    # Postgres, so CI runs one.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: yalp_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/yalp_test

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Karta şriftlari
        run: sudo apt-get install -y fonts-dejavu-core
      - run: npm ci
      - name: Testlar — alifbo, koordinata, baho va maʼlumotlar bazasi
        run: npm test
      - name: Maʼlumotlarni tekşiriş
        run: npm run validate
      # Everything a person writes — data, interface strings, docs — is
      # in the new alphabet. This is what keeps it that way: the project
      # spent weeks half-converted, with `ç` and `ş` applied while `oʻ`
      # and `gʻ` were left as the official digraphs, producing `koʻçasi`,
      # which is neither alphabet and which nothing caught.
      - name: Alifbo imlosi
        run: npm run canonicalise
      # The server build first: it produces .vercel/output, while the
      # static build below produces .output/public that the budget and
      # HTML checks read. Running them the other way round would have the
      # checks inspect whichever build happened to survive.
      - name: Server qurilişini sinash
        run: npm run build
      - name: Sayt qurilişini sinash
        run: npm run generate
      - name: Sahifa byudjeti
        run: npm run check:budget
      - name: HTML tekşiruvi
        run: npm run check:html
