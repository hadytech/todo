name: Validate

# Runs on every pull request. This is what makes "anyone can send a PR"
# safe: malformed data cannot reach the site.
on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Karta şriftlari
        run: sudo apt-get install -y fonts-dejavu-core
      - run: npm ci
      - name: Alifbo va koordinata testlari
        run: npm test
      - name: Maʼlumotlarni tekşiriş
        run: npm run validate
      - name: Sayt qurilişini sinash
        run: npm run generate
      - name: Sahifa byudjeti
        run: npm run check:budget
      - name: HTML tekşiruvi
        run: npm run check:html
