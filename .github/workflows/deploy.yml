name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; the newer commit always wins.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: the sitemap reads each listing's last commit date
          # for <lastmod>. A shallow clone has no per-file history, so every
          # lastmod would silently disappear rather than fail.
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Karta şriftlari
        run: sudo apt-get install -y fonts-dejavu-core
      - run: npm ci
      - run: npm test
      - run: npm run validate
      # Read the Pages configuration itself rather than keeping a second
      # copy of it in a repository variable. configure-pages resolves the
      # custom domain set in Settings, so the build can never disagree
      # with where the site is actually served — and the CNAME written
      # below comes from the same answer.
      #
      # This runs before the build because the build needs its outputs.
      - uses: actions/configure-pages@v5
        id: pages

      - name: Domen sozlamalari
        id: site
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          PAGES_HOST: ${{ steps.pages.outputs.host }}
        run: |
          # Force https. Before a custom domain's certificate is issued,
          # configure-pages reports the origin as http:// — and baking that
          # into canonical tags, og:url and the sitemap means every one of
          # them names a scheme the site will not be served on once the
          # cert lands. Pages is https for github.io hosts always and for
          # custom domains eventually, so https is the only correct answer.
          site_url="${PAGES_BASE_URL%/}"
          site_url="https://${site_url#*://}"
          base_path="${PAGES_BASE_PATH:-/}"
          echo "site_url=$site_url" >> "$GITHUB_OUTPUT"
          echo "base_path=$base_path" >> "$GITHUB_OUTPUT"
          # A *.github.io host is the default project site and needs no
          # CNAME file; anything else is a custom domain and does.
          case "$PAGES_HOST" in
            ''|*.github.io) echo "cname=" >> "$GITHUB_OUTPUT" ;;
            *)              echo "cname=$PAGES_HOST" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "Sayt: $site_url   asset prefiksi: $base_path"

      - run: npm run generate
        env:
          NUXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || steps.site.outputs.site_url }}
          NUXT_APP_BASE_URL: ${{ vars.BASE_URL || steps.site.outputs.base_path }}
          # Set repository variable INDEXABLE=true when the directory has
          # real content and should start being crawled.
          NUXT_PUBLIC_INDEXABLE: ${{ vars.INDEXABLE || 'false' }}
          # Both empty by default — nothing is loaded until they are set.
          NUXT_PUBLIC_ANALYTICS: ${{ vars.ANALYTICS || '' }}
          NUXT_PUBLIC_SITE_VERIFICATION: ${{ vars.SITE_VERIFICATION || '' }}
      - name: Sahifa byudjeti
        run: npm run check:budget
      - name: HTML tekşiruvi
        run: npm run check:html

      # Pages reads this file from the artifact to attach the domain. With
      # an Actions deploy the artifact wins, so omitting it would clear a
      # domain configured in Settings.
      - name: CNAME
        if: steps.site.outputs.cname != ''
        env:
          CNAME: ${{ steps.site.outputs.cname }}
        run: printf '%s\n' "$CNAME" > .output/public/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
